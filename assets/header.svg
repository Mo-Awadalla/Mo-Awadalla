<svg xmlns="http://www.w3.org/2000/svg" width="800" height="170" viewBox="0 0 800 170" role="img" aria-labelledby="title desc">
  <title id="title">Building the systems behind the interface</title>
  <desc id="desc">A dark banner with a softly moving signal connecting backend, AI/ML, automation, and infrastructure.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop offset="0" stop-color="#101b32"/>
      <stop offset="1" stop-color="#142c3b"/>
    </linearGradient>
    <linearGradient id="signal" x2="1" y2="0">
      <stop offset="0" stop-color="#53d6c4"/>
      <stop offset="1" stop-color="#8ba7ff"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #9db2c9; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
      .headline { fill: #f5f9ff; font-size: 31px; font-weight: 650; letter-spacing: -0.7px; }
      .topic { fill: #c7d5e6; font-size: 13px; font-weight: 600; letter-spacing: 0.3px; }
    </style>
  </defs>
  <rect width="800" height="170" rx="18" fill="url(#background)"/>
  <rect x="1" y="1" width="798" height="168" rx="17" fill="none" stroke="#315066" stroke-opacity=".7"/>
  <circle cx="34" cy="34" r="4" fill="#53d6c4"/>
  <text x="49" y="38" class="label">MOHAMED AWADALLA</text>
  <text x="34" y="91" class="headline">Building the systems behind the interface.</text>
  <path d="M34 124 H766" stroke="#355269" stroke-width="2" stroke-linecap="round"/>
  <path d="M34 124 H766" stroke="url(#signal)" stroke-width="2" stroke-linecap="round" opacity=".65"/>
  <circle cx="34" cy="124" r="4.5" fill="#8ba7ff">
    <animate attributeName="cx" values="34;766;34" keyTimes="0;.84;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.88;1" dur="7s" repeatCount="indefinite"/>
  </circle>
  <text x="34" y="151" class="topic">BACKEND</text>
  <text x="226" y="151" class="topic">AI / ML</text>
  <text x="417" y="151" class="topic">AUTOMATION</text>
  <text x="634" y="151" class="topic">INFRASTRUCTURE</text>
</svg>
